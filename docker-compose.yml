services:
  db:
    image: postgres:16-alpine
    container_name: zeut-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zeut
      POSTGRES_PASSWORD: zeut
      POSTGRES_DB: zeut
    ports:
      - "5432:5432"
    volumes:
      - zeut-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeut -d zeut"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zeut-pgdata:
